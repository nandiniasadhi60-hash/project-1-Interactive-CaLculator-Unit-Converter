
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Calculator & Unit Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Smart Calculator & Unit Converter</h1>
        <p>Calculate Faster. Convert Smarter.</p>
    </header>

    <nav>
        <button onclick="showSection('calculator')">
            Calculator
        </button>

        <button onclick="showSection('converter')">
            Unit Converter
        </button>
    </nav>

    <main class="container">

        <!-- CALCULATOR SECTION -->

        <section id="calculator" class="section active">

            <h2>🧮 Interactive Calculator</h2>

            <div class="calculator">

                <input
                    type="text"
                    id="display"
                    placeholder="0"
                    readonly
                >

                <div class="buttons">

                    <button onclick="clearDisplay()" class="operator">AC</button>
                    <button onclick="deleteLast()" class="operator">DEL</button>
                    <button onclick="appendValue('%')" class="operator">%</button>
                    <button onclick="appendValue('/')" class="operator">÷</button>

                    <button onclick="appendValue('7')">7</button>
                    <button onclick="appendValue('8')">8</button>
                    <button onclick="appendValue('9')">9</button>
                    <button onclick="appendValue('*')" class="operator">×</button>

                    <button onclick="appendValue('4')">4</button>
                    <button onclick="appendValue('5')">5</button>
                    <button onclick="appendValue('6')">6</button>
                    <button onclick="appendValue('-')" class="operator">−</button>

                    <button onclick="appendValue('1')">1</button>
                    <button onclick="appendValue('2')">2</button>
                    <button onclick="appendValue('3')">3</button>
                    <button onclick="appendValue('+')" class="operator">+</button>

                    <button onclick="appendValue('0')">0</button>
                    <button onclick="appendValue('.')">.</button>
                    <button onclick="calculateResult()" class="equal">=</button>

                </div>

            </div>

        </section>


        <!-- UNIT CONVERTER SECTION -->

        <section id="converter" class="section">

            <h2>📏 Unit Converter</h2>

            <div class="converter">

                <label for="category">Select Category</label>

                <select id="category" onchange="updateUnits()">
                    <option value="length">Length</option>
                    <option value="weight">Weight</option>
                    <option value="temperature">Temperature</option>
                    <option value="time">Time</option>
                    <option value="data">Data</option>
                    <option value="speed">Speed</option>
                </select>

                <label for="inputValue">Enter Value</label>

                <input
                    type="number"
                    id="inputValue"
                    placeholder="Enter value"
                    oninput="convertUnit()"
                >

                <label for="fromUnit">From</label>

                <select id="fromUnit" onchange="convertUnit()">
                </select>

                <label for="toUnit">To</label>

                <select id="toUnit" onchange="convertUnit()">
                </select>

                <button onclick="convertUnit()" class="convert-btn">
                    Convert
                </button>

                <div class="result">
                    <h3>Conversion Result</h3>
                    <p id="conversionResult">Your result will appear here</p>
                </div>

            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 Smart Calculator & Unit Converter | Developed with HTML, CSS & JavaScript</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
